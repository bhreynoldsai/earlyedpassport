name: CI

on:
  # Branch commits are covered by the pull_request trigger. Listening to both
  # push:['**'] and pull_request runs every PR commit twice for no extra signal.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # The RLS tests need a real Postgres. Without one they SKIP, and a green
    # run that skipped them proves nothing — so CI always provides one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eep_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/eep_test

    steps:
      - uses: actions/checkout@v4

      # pdftotext, for the test that re-parses the committed 2013 PDFs and
      # proves they still produce the committed GELDS artifact. Without it that
      # half of tests/unit/gelds-artifact.test.ts skips, and a skipped
      # provenance check is exactly what it exists to prevent.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Lint (includes token and copy rules)
        run: pnpm lint

      - name: Schema rebuilds from zero
        run: pnpm db:verify

      - name: Generated types match the migrations
        # `supabase gen types typescript` pulls postgres-meta from a public
        # registry on every run, uncached — on the shared runner pool that
        # occasionally comes back "toomanyrequests: Rate exceeded", nothing to
        # do with our schema or types. Retry with backoff rather than fail the
        # build on a registry hiccup; a real drift between the migrations and
        # the committed types fails the same way on every attempt, so this
        # can't mask an actual bug.
        run: |
          for attempt in 1 2 3 4; do
            if pnpm db:types:check; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::db:types:check failed after $attempt attempts."
              exit 1
            fi
            wait=$((attempt * 20))
            echo "::warning::db:types:check failed (attempt $attempt/4) — retrying in ${wait}s."
            sleep "$wait"
          done

      - name: Types
        run: pnpm typecheck

      - name: Tests (unit + row level security)
        run: pnpm test

      - name: Guard against a skipped RLS suite
        run: |
          # A run where the RLS tests skipped is not a passing run.
          pnpm test 2>&1 | tee /tmp/test.log
          if grep -q "RLS tests were SKIPPED" /tmp/test.log; then
            echo "::error::The RLS suite skipped. DATABASE_URL is not reaching the tests."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Release blockers
        # Reports on every run; fatal only on a version tag.
        run: pnpm lint:release
